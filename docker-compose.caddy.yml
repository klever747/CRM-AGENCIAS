# Optional HTTPS overlay. Use this once you have a domain pointing at the
# VPS IP address:
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# Edit Caddyfile first and replace "your-domain.com" with your real domain.

services:
  app:
    # No longer publish 3000 directly to the internet; Caddy fronts it.
    ports: []
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: crm-agencias-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
